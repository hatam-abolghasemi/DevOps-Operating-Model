name: Release

# Move CHANGELOG.md's [Unreleased] entries under "## [X.Y.Z] - YYYY-MM-DD",
# bump CITATION.cff, commit to main, then push an annotated tag (its message is
# the title after the dash):
#   git tag -a v3.0.0 -m "short description" && git push origin v3.0.0
# Or rerun for an existing tag: Actions -> Release -> Run workflow.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, e.g. v2.0.0"
        required: true
      title:
        description: "Title after the dash (default: the tag's message)"
        required: false

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.v.outputs.tag }}
          persist-credentials: false
      - name: Tag, changelog and citation agree
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          grep -Eq "^## \[${V//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md \
            || { echo "::error file=CHANGELOG.md::no '## [${V}] - YYYY-MM-DD' section"; exit 1; }
          cff=$(sed -n 's/^version: *//p' CITATION.cff)
          [ "$cff" = "$V" ] || { echo "::error file=CITATION.cff::version is $cff, tag is $V"; exit 1; }

  docs:
    name: Docs
    needs: prepare
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  release:
    name: GitHub release
    needs: [prepare, docs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Title and notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          V: ${{ needs.prepare.outputs.version }}
          TITLE: ${{ github.event.inputs.title }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          # Only an annotated tag carries a title; a lightweight one would
          # hand back the commit message instead.
          if [ -z "$TITLE" ] && [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            TITLE=$(git tag -l --format='%(contents:subject)' "$TAG")
            case "$TITLE" in "DevOps Operating Model"*|"$TAG"|"$V") TITLE="" ;; esac
          fi
          if [ -n "$TITLE" ]; then echo "TITLE=$TAG — $TITLE" >> "$GITHUB_ENV"; else echo "TITLE=$TAG" >> "$GITHUB_ENV"; fi
          # The section under "## [V] - date", up to the next version heading
          # or the link references at the bottom.
          awk -v v="$V" '
            index($0, "## [" v "] - ") == 1 { f = 1; next }
            /^## \[/ || /^\[[^]]+\]: / { f = 0 }
            f
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "::error file=CHANGELOG.md::the ${V} section is empty"; exit 1
          fi
          # Relative links resolve against the tagged tree.
          sed -i -E "s#\]\(([0-9]-[a-z]+/|templates/|[A-Z_]+\.md)#](${REPO_URL}/blob/${TAG}/\1#g" notes.md
          cat notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --latest
          else
            gh release create "$TAG" --title "$TITLE" --notes-file notes.md --latest --verify-tag
          fi
